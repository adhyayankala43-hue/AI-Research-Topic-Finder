<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Topic Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        
        /* Base Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0; /* Hidden by default until animation triggers */
        }

        /* Staggered animation delays */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Card Styling & Hover Effects */
        .card {
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .metric-card { 
            border-left: 4px solid #0d6efd !important; 
            border-radius: 6px; 
            height: 100%;
        }

        .hover-elevate:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
            cursor: pointer;
        }

        /* Badge Animations */
        .badge-keyword { 
            background-color: #e9ecef; 
            color: #495057; 
            margin-right: 4px; 
            transition: all 0.3s ease; 
            display: inline-block;
        }
        
        .badge-keyword:hover { 
            background-color: #0d6efd; 
            color: white; 
            transform: scale(1.05);
        }

        /* Smooth transitions for interactive elements */
        .btn { transition: all 0.3s ease; }
        .accordion-button { transition: background-color 0.3s ease, color 0.3s ease; }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 1055;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<div id="loading-overlay">
    <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="mt-4 text-primary fw-bold">Processing Research Data...</h4>
    <p class="text-muted">Loading topics, gaps, and emerging trends</p>
</div>    
<nav class="navbar navbar-dark bg-dark px-4 py-3 shadow">
    <span class="navbar-brand mb-0 h1">🔭 AI Research Topic Discovery System</span>
    <a href="/api/export" class="btn btn-outline-light btn-sm hover-elevate">Export Topic Report (JSON)</a>
</nav>

<div class="container-fluid py-4 px-4">
    <!-- Domain Filter Row -->
    <div class="row mb-4 animate-fade-up">
        <div class="col-md-6 d-flex align-items-center">
            <label class="me-2 fw-semibold">Filter Domain:</label>
            <select id="domainSelect" class="form-select w-50 shadow-sm" onchange="loadDashboard()">
                <option value="All">All Domains</option>
                {% for domain in domains %}
                    <option value="{{ domain }}">{{ domain }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- Metric / Extraction Cards -->
    <div class="row mb-4" id="latentTopicsRow"></div>

    <!-- Visualizations & Gap Identification -->
    <div class="row mb-4">
        <div class="col-lg-7 animate-fade-up delay-1">
            <div class="card shadow-sm p-3 hover-elevate h-100">
                <h6 class="fw-bold text-primary mb-3">Topic Growth Velocity & Mentions</h6>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-5 animate-fade-up delay-2">
            <div class="card shadow-sm p-3 hover-elevate h-100">
                <h6 class="fw-bold text-primary mb-3">Identified Research Gaps (Cross-Domain)</h6>
                <div id="gapContainer" class="list-group list-group-flush mt-2"></div>
            </div>
        </div>
    </div>

    <!-- Recommendations & Clusters -->
    <div class="row">
        <div class="col-lg-6 animate-fade-up delay-3">
            <div class="card shadow-sm p-3 mb-4 h-100">
                <h6 class="fw-bold text-primary">Topic Recommendation Engine</h6>
                <div class="input-group my-3 shadow-sm rounded">
                    <input type="text" id="interestQuery" class="form-control border-primary" placeholder="e.g., medical deep learning for diagnosis">
                    <button class="btn btn-primary" onclick="getRecommendations()">Find Topics</button>
                </div>
                <div id="recResults" class="mt-2"></div>
            </div>
        </div>
        <div class="col-lg-6 animate-fade-up delay-4">
            <div class="card shadow-sm p-3 mb-4 h-100">
                <h6 class="fw-bold text-primary mb-3">K-Means Topic Clusters</h6>
                <div id="clusterContainer" class="accordion mt-2 shadow-sm"></div>
            </div>
        </div>
    </div>
</div>

<script>
let chartInstance = null;

async function loadDashboard() {
    const domain = document.getElementById('domainSelect').value;
    const res = await fetch(`/api/analytics?domain=${domain}`);
    const data = await res.json();

    // Render LDA Latent Topics with staggered animation
    const topicsContainer = document.getElementById('latentTopicsRow');
    topicsContainer.innerHTML = '';
    Object.entries(data.topics).forEach(([title, words], index) => {
        const delayClass = `delay-${(index % 4) + 1}`; // Staggered delays 1 to 4
        topicsContainer.innerHTML += `
            <div class="col-md-3 mb-2 animate-fade-up ${delayClass}">
                <div class="card p-3 shadow-sm metric-card hover-elevate bg-white">
                    <div class="text-muted small text-uppercase fw-bold">${title}</div>
                    <div class="fw-bold mt-2 text-dark">${words.join(', ')}</div>
                </div>
            </div>`;
    });

    // Render Research Gaps
    const gapContainer = document.getElementById('gapContainer');
    gapContainer.innerHTML = '';
    data.gaps.forEach((g, index) => {
        gapContainer.innerHTML += `
            <div class="list-group-item px-0 animate-fade-up" style="animation-delay: ${index * 0.1}s;">
                <div class="fw-bold text-dark">${g.domains}</div>
                <small class="text-secondary">${g.hypothesis}</small>
            </div>`;
    });

    // Render K-Means Clusters
    const clusterContainer = document.getElementById('clusterContainer');
    clusterContainer.innerHTML = '';
    Object.entries(data.clusters).forEach(([id, items], idx) => {
        clusterContainer.innerHTML += `
            <div class="accordion-item border-0 border-bottom animate-fade-up" style="animation-delay: ${idx * 0.1}s;">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-semibold text-dark bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#c${idx}">
                        Cluster ${parseInt(id) + 1} &nbsp;<span class="badge bg-primary rounded-pill">${items.length} Papers</span>
                    </button>
                </h2>
                <div id="c${idx}" class="accordion-collapse collapse">
                    <div class="accordion-body bg-white">
                        <ul class="mb-0 small ps-0 text-secondary">
                            ${items.map((p, pIdx) => `
                                <li class="mb-3 list-unstyled">
                                    <div class="d-flex justify-content-between align-items-center p-2 rounded hover-elevate bg-light" style="cursor: pointer;" data-bs-toggle="collapse" data-bs-target="#clusterAbs${idx}_${pIdx}">
                                        <span class="fw-medium text-dark"><i class="bi bi-file-text me-2"></i>${p.title}</span>
                                        <span class="badge bg-white text-dark border ms-1">${p.domain}</span>
                                    </div>
                                    <!-- Hidden Abstract Panel -->
                                    <div class="collapse mt-1" id="clusterAbs${idx}_${pIdx}">
                                        <div class="p-3 bg-white rounded border border-top-0 shadow-sm text-muted">
                                            <strong>Abstract:</strong> ${p.abstract}
                                        </div>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            </div>`;
    });

    // Render Chart.js Trends
    renderChart(data.trends);
}

function renderChart(trendData) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    const labels = trendData.trends.map(t => t.keyword);
    const mentions = trendData.trends.map(t => t.total_mentions);
    const velocities = trendData.trends.map(t => t.growth_velocity);

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: 'Total Mentions', data: mentions, backgroundColor: 'rgba(13, 110, 253, 0.7)', borderRadius: 4 },
                { label: 'Growth Velocity', data: velocities, backgroundColor: 'rgba(25, 135, 84, 0.7)', borderRadius: 4 }
            ]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } },
            animation: {
                duration: 1000,
                easing: 'easeOutQuart'
            }
        }
    });
}

async function getRecommendations() {
    const query = document.getElementById('interestQuery').value;
    const domain = document.getElementById('domainSelect').value;
    
    // Add a quick loading state
    const container = document.getElementById('recResults');
    container.innerHTML = '<div class="text-center py-3 text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Searching...</div>';

    const res = await fetch('/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query, domain: domain })
    });
    const data = await res.json();

    if (!data.recommendations.length) {
        container.innerHTML = `<div class="alert alert-warning py-2 small animate-fade-up">No matching topics found. Try broader keywords.</div>`;
        return;
    }

    container.innerHTML = data.recommendations.map((r, index) => `
        <div class="border rounded p-3 mb-2 bg-white hover-elevate animate-fade-up shadow-sm" style="animation-delay: ${index * 0.1}s; cursor: pointer;" data-bs-toggle="collapse" data-bs-target="#recAbs${index}">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="fw-semibold text-dark">${r.title}</span>
                <span class="badge bg-success shadow-sm">Match: ${(r.score * 100).toFixed(0)}%</span>
            </div>
            <div class="small text-muted mb-2">Domain: ${r.domain} | Year: ${r.year}</div>
            <div>${r.keywords.map(k => `<span class="badge badge-keyword">${k}</span>`).join('')}</div>
            
            <!-- Hidden Abstract Panel -->
            <div class="collapse mt-3" id="recAbs${index}">
                <div class="card card-body bg-light text-secondary small p-3 border-0 shadow-inner">
                    <strong class="text-dark mb-1">Research Abstract:</strong>
                    ${r.abstract}
                </div>
            </div>
        </div>
    `).join('');
}
// Example modification for your analytics fetch function
function loadDashboardData(domain) {
    showLoader(); 
    
    fetch(`/api/analytics?domain=${domain}`)
        .then(response => response.json())
        .then(data => {
            // Your existing chart and HTML rendering logic goes here
        })
        .catch(error => {
            console.error("Error loading data:", error);
        })
        .finally(() => {
            // This guarantees the overlay disappears no matter what happens above
            hideLoader(); 
        });
}
document.addEventListener('DOMContentLoaded', loadDashboard);
// Add LOADING script
function showLoader() {
    document.getElementById('loading-overlay').style.display = 'flex';
}

function hideLoader() {
    document.getElementById('loading-overlay').style.display = 'none';
}
// Automatically fetch data and hide the loader when the page is first opened
document.addEventListener('DOMContentLoaded', () => {
    // Assuming 'All' is your default domain filter
    loadDashboardData('All'); 
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
